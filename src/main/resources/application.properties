spring.application.name=jobportal

# Database Configuration (using environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobportal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Jackson date serialization — emit ISO-8601 strings instead of timestamp arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Enable lazy loading outside of transaction context (backup solution for proxy serialization)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Cloudinary Credentials
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# File Upload Limits (Important for resumes > 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

